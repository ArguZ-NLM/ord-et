<body>
<style>
/* Layout: one centred work column; a "workbench" card holds the word as letter blocks you cut apart. */
:root {
  --bg: #e9edf1;
  --surface: #ffffff;
  --surface-2: #f4f6f9;
  --fg: #17202b;
  --muted: #5a6676;
  --line: #d3dae2;
  --ink: #17202b;          /* primary buttons + cut marks */
  --ink-fg: #ffffff;
  --ok: #23803a;
  --bad: #c42b2b;
  --miss: #c47700;
  /* morpheme pens, after the workbook's coloured underlines */
  --t-F: #7b3fc4;  /* forstavelse – lilla (not red: red means a mistake) */
  --t-R: #1d232b;  /* rod – sort */
  --t-A: #22803a;  /* afledning – grøn */
  --t-B: #1f5bd6;  /* bøjning – blå */
  --t-L: #c07000;  /* bindebogstav – orange */
  --tint-F: #f1eafb; --tint-R: #eceff3; --tint-A: #e6f3e9; --tint-B: #e7eefc; --tint-L: #fbf0de;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "Atkinson Hyperlegible Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161c; --surface: #1a2129; --surface-2: #212a34; --fg: #e8edf2; --muted: #9aa7b6; --line: #303b47;
    --ink: #e8edf2; --ink-fg: #11161c; --ok: #5cc677; --bad: #ff6b6b; --miss: #f0a640;
    --t-F: #b991ff; --t-R: #e8edf2; --t-A: #5cc677; --t-B: #6fa0ff; --t-L: #f0a640;
    --tint-F: #2c2140; --tint-R: #26303b; --tint-A: #1c3324; --tint-B: #1d2a45; --tint-L: #3a2c17;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161c; --surface: #1a2129; --surface-2: #212a34; --fg: #e8edf2; --muted: #9aa7b6; --line: #303b47;
  --ink: #e8edf2; --ink-fg: #11161c; --ok: #5cc677; --bad: #ff6b6b; --miss: #f0a640;
  --t-F: #b991ff; --t-R: #e8edf2; --t-A: #5cc677; --t-B: #6fa0ff; --t-L: #f0a640;
  --tint-F: #2c2140; --tint-R: #26303b; --tint-A: #1c3324; --tint-B: #1d2a45; --tint-L: #3a2c17;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 860px; margin: 0 auto; display: grid; gap: 20px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: 1.3rem; font-weight: 800; }
h3 { font-size: 1.05rem; font-weight: 600; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--t-B); outline-offset: 2px; border-radius: 4px; }

/* ---------- top bar ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand small { color: var(--muted); font-size: .9rem; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: grid; gap: 18px; min-width: 0; }
.muted { color: var(--muted); }
.label { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }

/* ---------- buttons ---------- */
.btn { border: 1px solid var(--line); background: var(--surface); padding: 10px 16px; border-radius: var(--r); cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn.primary { background: var(--ink); color: var(--ink-fg); border-color: var(--ink); }
.btn.primary:hover:not(:disabled) { opacity: .9; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.small { padding: 6px 10px; font-size: .88rem; }
.btn.danger { color: var(--bad); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.spread { justify-content: space-between; }
kbd { font-family: var(--font-mono); font-size: .78em; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--surface-2); }

/* ---------- chips (options) ---------- */
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choice { border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 10px 14px; cursor: pointer; text-align: left; display: grid; gap: 2px; min-width: 0; }
.choice b { font-weight: 700; }
.choice span { font-size: .85rem; color: var(--muted); }
.choice[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); background: var(--surface-2); }
.choice.compact { padding: 8px 14px; }

/* ---------- morpheme chips ---------- */
.morphs { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-end; font-family: var(--font-mono); }
.m { display: inline-grid; justify-items: center; gap: 2px; }
.m .seg { font-size: 1.35rem; font-weight: 600; padding: 2px 8px 4px; border-radius: 6px; background: var(--surface-2); border-bottom: 4px solid var(--line); line-height: 1.2; }
.m .tlabel { font-family: var(--font-body); font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
/* blocks are as wide as their letters; labels alternate below / above (fitMorphs) and only take another line if they still collide */
.m { position: relative; }
.m .tlabel { position: absolute; left: 50%; top: 100%; margin-top: 2px; width: 0; display: flex; justify-content: center; white-space: nowrap; letter-spacing: .02em; line-height: 1.5; transform: translate(var(--dx, 0px), calc(var(--lv, 0) * 1.5em)); }
.m .tlabel.up { top: auto; bottom: 100%; margin: 0 0 2px; transform: translate(var(--dx, 0px), calc(var(--lv, 0) * -1.5em)); }
.morphs { padding-block: calc(var(--up, 0) * 1.1rem) calc(var(--down, 1) * 1.1rem); row-gap: calc(6px + (var(--up, 0) + var(--down, 1)) * 1.1rem); }
/* the start-page example fills the grey box: fitDemo() sets --demo-size from the box width */
#demo .morphs { column-gap: .25em; font-size: var(--demo-size, 1.35rem); }
#demo .m .seg { font-size: 1em; padding: .08em .3em .15em; border-bottom-width: .14em; }
#demo .m .tlabel { font-size: max(.7rem, .3em); }

function parseLine(line) {
  let note = "";
  const si = line.indexOf(";");
  if (si >= 0) { note = line.slice(si + 1).trim(); line = line.slice(0, si).trim(); }
  const alts = []; let word = null;
  for (const part of line.split("/")) {
    const toks = part.trim().split(/\s+/).filter(Boolean);
    if (!toks.length) continue;
    const segs = toks[0].toLowerCase().split(/[-|+·]+/).filter(s => s.length);
    const w = segs.join("");
    if (!w || !/^[a-zæøåéèüöäáí]+$/.test(w)) return { error: true };
    if (word === null) word = w; else if (w !== word) return { error: true };
    let types = null;
    if (toks.length > 1) {
      const ty = toks.slice(1).join("").toUpperCase();
      if (!/^[FRABL]+$/.test(ty) || ty.length !== segs.length) return { error: true };
      types = ty.split("");
    }
    alts.push({ segs, types });
  }
  if (!alts.length) return { error: true };
  return { item: { word, alts, note } };
}
function parseList(text) {
  const items = [], seen = new Set();
  text.split(/\r?\n/).forEach(raw => {
    const line = raw.trim();
    if (!line || line.startsWith("#")) return;
    const r = parseLine(line);
    if (!r.error && !seen.has(r.item.word)) { seen.add(r.item.word); items.push(r.item); }
  });
  return items;
}

/* difficulty from how many morphemes a word has and which kinds:
   points = (morphemes − 1) + 1 per forstavelse + 1 per afledning + ½ per bindebogstav
   Let = two morphemes, only rod/bøjning · Mellem = up to 3 points · Svær = more than 3 points.
   Long words are harder whatever their parts: 10+ letters is at least Mellem, 14+ letters is Svær. */
const LEVELS = ["let", "mellem", "svaer"];
function levelOf(item) {
  const a = item.alts[0], n = a.segs.length, len = item.word.length;
  let lv;
  if (!a.types) lv = n <= 2 ? 0 : n === 3 ? 1 : 2;
  else {
    const ty = a.types.join("");
    const pts = (n - 1) + (ty.match(/F/g) || []).length + (ty.match(/A/g) || []).length + 0.5 * (ty.match(/L/g) || []).length;
    lv = n <= 2 && /^[RB]+$/.test(ty) ? 0 : pts <= 3 ? 1 : 2;
  }
  return LEVELS[Math.max(lv, len >= 14 ? 2 : len >= 10 ? 1 : 0)];
}

function mixedPool(level = prefs.level, vocab = prefs.vocab) {
  const seen = new Set(), out = [], mis = new Set(mistakes), rep = new Set(reported);
  [CURATED, ...AUTO_ITEMS.map(list => vocab === "common" ? list.slice(0, COMMON_N) : list)].forEach(list => list.forEach(it => {
    if (seen.has(it.word) || (it.auto && rep.has(it.word))) return;
    if (vocab === "mistakes" ? !mis.has(it.word) : levelOf(it) !== level) return;
    seen.add(it.word); out.push(it);
  }));
  return out;
}

}

let session = null;   // {items, idx, kind:{mistakes|retry|level,vocab}, results, finished}
let cur = null;       // {item, cuts:Set, phase, alt, ok, hint}

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
// a round's label is rebuilt in the current language every time it is shown
function roundLabel(k) {
  if (k.set && !k.level && !k.kind) return k.set;   // results saved before the language option
  if (k.kind === "mistakes" || k.kind === "retry") return t("labelMis");
  return t("labelLevel", levelName(k.level)) + (k.vocab === "common" ? t("labelCommon") : "");
}

function startSession(items) {
  let pool = items || shuffle(mixedPool());
  if (!items && prefs.count) pool = pool.slice(0, prefs.count);
  const kind = items ? { kind: "retry" } : prefs.vocab === "mistakes" ? { kind: "mistakes" } : { kind: "level", level: prefs.level, vocab: prefs.vocab };

}

const maxPoints = () => session.items.reduce((s, it) => s + (isRep(it) ? 0 : 1), 0);
const points = () => session.results.reduce((s, r) => s + (!r.reported && r.splitOk ? 1 : 0), 0);

function renderPracticeChrome() {

  $("p-count").textContent = t("wordOf", session.idx + 1, session.items.length);
  $("p-score").textContent = t("points", points());
  if (cur && cur.hint) $("hint-text").textContent = hintText();

  renderClue();

/* before the check: what the word means, so a word that can be both noun and verb (øget: et øg or at øge)

   compounds get no clue, as their parts would. */
function renderClue() {
  const m = cur && cur.phase === "split" && MEANINGS && MEANINGS.w[cur.item.word];
  const e = m && !Array.isArray(m) && MEANINGS.l[m];
  const first = prefs.lang === "en" ? 1 : 0, txt = e && (e[first] || e[1 - first]);
  $("clue").hidden = !txt;

}

  $("split-actions").hidden = false;
  $("btn-hint").disabled = false;
  renderPracticeChrome();
  const firstGap = $("word").querySelector(".gap");
  if (firstGap) firstGap.focus({ preventScroll: true });
}

function renderWord(marks) {
  const w = cur.item.word, el = $("word");
  let h = "";
  for (let i = 0; i < w.length; i++) {
    if (i > 0) {
      const m = marks ? marks[i] : (cur.cuts.has(i) ? "cut" : "");
      h += `<button class="gap ${m || ""}" data-gap="${i}" aria-pressed="${cur.cuts.has(i)}" aria-label="${esc(t("gapLabel", w[i - 1], w[i]))}" ${marks ? "disabled" : ""}></button>`;
    }

// measure the word at full size and shrink it proportionally until it fits the box
function fitWord() {
  const el = $("word"); if (!cur) return;
  const st = getComputedStyle(el.parentElement);
  const avail = el.parentElement.clientWidth - parseFloat(st.paddingLeft) - parseFloat(st.paddingRight);
  if (avail <= 0) return;  // not on screen yet; show() fits it again
  // long words: narrower spaces between the letters first, so the letters can stay bigger
  for (const gap of [".5em", ".3em", ".15em"]) {
    el.style.setProperty("--gap", gap); el.style.fontSize = "56px";
    const size = Math.min(56, Math.floor(56 * avail / el.scrollWidth * 10) / 10);
    el.style.fontSize = size + "px";
    if (size >= 30) break;
  }
}

function toggleCut(i) {
  if (cur.phase !== "split") return;

  cur.cuts.has(i) ? cur.cuts.delete(i) : cur.cuts.add(i);
  renderWord();
  const g = $("word").querySelector(`.gap[data-gap="${i}"]`); if (g) g.focus({ preventScroll: true });

$("btn-hint").addEventListener("click", () => { cur.hint = true; $("hint-text").textContent = hintText(); $("btn-hint").disabled = true; });

/* ---------- rule hint: the rule-book rows that match this word's morphemes ---------- */
const SECTION_OF = { B: "boejning", A: "afledning", F: "forstavelse", L: "binde" };
const RULE_INDEX = (() => {
  const idx = {};   // "B:er" -> [{k, group, row}]
  const add = (k, row, group) => {
    const m = Array.isArray(row[0]) ? row[0][0] : row[0];
    m.replace(/-/g, " ").trim().split(/\s+/).forEach(tok => { (idx[k + ":" + tok] ||= []).push({ k, group, row }); });
  };
  RULES.B.forEach(g => g.rows.forEach(r => add("B", r, g.title)));
  RULES.A.forEach(r => add("A", r)); RULES.F.forEach(r => add("F", r)); RULES.L.forEach(r => add("L", r));
  return idx;
})();
function ruleHintHTML(item) {
  const a = item.alts[0];
  if (!a.types) return `<p class="muted">${t("noTypes")}</p>`;
  const parts = [], seen = new Set(), sections = [];
  const pushRow = (hit, seg) => {
    const key = hit.k + "|" + L2(hit.row[1]) + "|" + (hit.group ? hit.group[0] : "");
    if (seen.has(key)) return; seen.add(key);
    if (!sections.includes(SECTION_OF[hit.k])) sections.push(SECTION_OF[hit.k]);
    parts.push(`<li><span class="rh-m" style="--c:var(--t-${hit.k})">${esc(L2(hit.row[0]))}</span>` +
      `<span><b>${esc(TY(hit.k).name)}${hit.group ? " · " + esc(L2(hit.group)) : ""}</b>${L2(hit.row[1]) ? " – " + esc(L2(hit.row[1])) : ""}</span>` +
      `<span class="rh-ex">${hit.row[2].map(ex).join(" ")}</span></li>`);
  };
  // a derivational suffix tells the word class, so only that class's endings are shown
  const adj = a.segs.some((sg, i) => a.types[i] === "A" && ["lig", "ig", "som", "bar", "løs"].includes(sg));
  const noun = a.segs.some((sg, i) => a.types[i] === "A" && ["hed", "skab", "dom", "else", "ning", "ing", "inde", "er"].includes(sg));
  const keep = h => h.k !== "B" || !(adj || noun) || h.group[0] === (adj ? "Tillægsord" : "Navneord");
  a.segs.forEach((seg, i) => {
    const k = a.types[i]; if (k === "R") return;
    (RULE_INDEX[k + ":" + seg] || []).filter(keep).forEach(h => pushRow(h, seg));
  });
  const roots = a.types.filter(k => k === "R").length;
  if (roots >= 2 && !a.types.includes("L")) (RULE_INDEX["L:intet"] || []).forEach(h => pushRow(h));
  // traps that fit: a root ending in e before an ending, and the three meanings of -er
  const traps = [];
  if (a.segs.some((sg, i) => a.types[i] === "R" && /e$/.test(sg) && a.types[i + 1] === "B")) traps.push(RULES.traps[0]);
  if (a.segs.includes("er")) traps.push(RULES.traps[1]);
  let h = `<div class="row spread"><span class="label">${t("ruleH")}</span>`;
  if (sections.length || traps.length) h += `<button class="btn small" id="btn-rule-open" data-sec="${sections[0] || "faelder"}">${t("ruleOpen")}</button>`;
  h += "</div>";
  if (a.segs.length === 1) h += `<p>${t("ruleRoot")}</p>`;
  else if (roots >= 2) h += `<p class="muted">${t("ruleCompound")}</p>`;
  if (parts.length) h += `<ul class="rh-list">${parts.join("")}</ul>`;
  traps.forEach(([hd, txt]) => { h += `<div class="trap"><b>${L2(hd)}</b><span>${L2(txt)}</span></div>`; });
  return h;
}
function renderRuleHint() {
  const open = cur && cur.ruleOpen;
  $("rule-hint").hidden = !open;
  $("btn-rule").setAttribute("aria-expanded", !!open);
  if (open) $("rule-hint").innerHTML = ruleHintHTML(cur.item);
}
$("btn-rule").addEventListener("click", () => { cur.ruleOpen = !cur.ruleOpen; renderRuleHint(); });
$("rule-hint").addEventListener("click", e => {
  if (e.target.id !== "btn-rule-open") return;
  const sec = e.target.dataset.sec;
  renderRules(); show("rules"); showRuleSec(sec);
});

/* ---------- check split ---------- */
$("btn-check").addEventListener("click", checkSplit);
function checkSplit() {
  if (cur.phase !== "split") return;
  const user = [...cur.cuts].sort((a, b) => a - b);
  const key = user.join(",");
  let alt = cur.item.alts.find(a => cutsOf(a.segs).join(",") === key);
  const ok = !!alt;
  if (!alt) {  // pick the closest alternative for feedback
    alt = cur.item.alts.map(a => { const c = cutsOf(a.segs); return { a, d: c.filter(x => !cur.cuts.has(x)).length + user.filter(x => !c.includes(x)).length }; })
      .sort((x, y) => x.d - y.d)[0].a;
  }
  cur.alt = alt; cur.ok = ok;
  const correct = cutsOf(alt.segs);
  cur.marks = {};
  for (let i = 1; i < cur.item.word.length; i++) {
    const u = cur.cuts.has(i), c = correct.includes(i);
    cur.marks[i] = u && c ? "ok" : u ? "extra" : c ? "miss" : "";
  }
  cur.phase = "done";
  $("split-actions").hidden = true;
  renderClue();
  session.results.push({ item: cur.item, userSegs: segsFromCuts(cur.item.word, cur.cuts), alt, splitOk: ok, hint: cur.hint });
  noteMistake(cur.item.word, !ok);
  renderFeedback();
  if (ok) celebrate();
  $("p-score").textContent = t("points", points());
  $("next-row").hidden = false;
  setNextLabel();
  $("btn-next").focus({ preventScroll: true });
}
function celebrate() {
  const stage = $("word").parentElement;
  stage.classList.remove("win"); void stage.offsetWidth; stage.classList.add("win");
}
function renderFeedback() {
  renderWord(cur.marks);
  const { ok, alt } = cur, rec = session.results[session.results.length - 1];
  const fb = $("feedback");
  fb.className = "feedback " + (ok ? "good" : "bad");
  let h = `<div class="verdict">${ok ? t("ok") : t("notOk")}</div>`;
  if (!ok) h += `<p style="font-size:.92rem">${t("marksHelp")}</p>`;
  h += `<div style="display:grid;gap:8px"><span class="label">${ok ? t("theMorphs") : t("rightSplit")}</span>${morphHTML(alt.segs, alt.types)}</div>`;
  const mean = meaningHTML(cur.item.word);
  h += mean || (alt.types ? explainHTML(alt) : `<p class="note">${t("noTypes")}</p>`);
  if (cur.item.alts.length > 1) h += `<p class="note">${t("alsoOk")}${esc(cur.item.alts.filter(a => a !== alt).map(a => a.segs.join(" | ")).join(" · "))}</p>`;
  if (cur.item.note) h += `<p class="note">${esc(noteText(cur.item.note))}</p>`;
  if (cur.item.auto) h += `<div class="row auto-row"><span class="muted" style="font-size:.88rem">${t("autoBadge")}</span>` +
    (rec.reported ? `<span class="muted" style="font-size:.9rem">${t("reported")}</span>` : `<button class="btn small" id="btn-report">${t("report")}</button>`) + "</div>";
  fb.innerHTML = h; fb.hidden = false; fitMorphs();
}
/* what the word means (meanings.json, built from DanNet and the Danish and English Wiktionary; see tools/meanings).
   An inflected word shows its base form (vejen → vej); a compound without its own entry shows each part. */
let MEANINGS = null;
fetch("meanings.json").then(r => r.json()).then(d => { MEANINGS = d; if (cur && cur.phase === "done") renderFeedback(); renderClue(); }).catch(() => {});
function meaningHTML(word) {
  const m = MEANINGS && MEANINGS.w[word]; if (!m) return "";
  const lems = Array.isArray(m) ? m : [m];   // keys are "baseword|wordclass"
  const first = prefs.lang === "en" ? 1 : 0;
  const rows = lems.map(l => {
    const e = MEANINGS.l[l] || ["", ""], txt = e[first] || e[1 - first]; if (!txt) return "";
    const other = !e[first] ? ` <span class="src">(${t("otherLang")})</span>` : "";
    const base = l.split("|")[0];
    const head = lems.length > 1 || base !== word ? `<b>${esc(base)}</b> – ` : "";
    return `<li>${head}${esc(txt)}${other}</li>`;
  }).filter(Boolean);
  if (!rows.length) return "";
  return `<div style="display:grid;gap:6px"><span class="label">${t("meaningH")}</span><ul class="meaning">${rows.join("")}</ul><span class="src" style="font-size:.78rem;color:var(--muted)">${t("meaningSrc")}</span></div>`;
}
function explainHTML(alt) {
  return '<ul class="explain">' + alt.segs.map((s, i) =>
    `<li><code style="color:var(--t-${alt.types[i]})">${esc(s)}</code><span>${esc(gloss(s, alt.types[i]))}</span></li>`).join("") + "</ul>";
}
$("feedback").addEventListener("click", e => {
  if (e.target.id !== "btn-report") return;
  const rec = session.results[session.results.length - 1];
  if (rec.reported) return;
  rec.reported = true;
  noteMistake(rec.item.word, false);
  if (!reported.includes(rec.item.word)) { reported.push(rec.item.word); store.set("reported", reported); }
  renderFeedback();
  $("p-score").textContent = t("points", points());
});
function setNextLabel() { $("btn-next").textContent = session.idx === session.items.length - 1 ? t("seeResult") : t("next"); }
$("btn-next").addEventListener("click", () => {
  if (session.idx < session.items.length - 1) { session.idx++; loadWord(); window.scrollTo({ top: 0 }); }
  else endSession();
});
$("btn-quit").addEventListener("click", () => endSession(true));

/* ---------- keyboard ---------- */
document.addEventListener("keydown", e => {
  if ($("v-practice").hidden || e.key !== "Enter") return;
  if (e.target.closest && e.target.tagName === "BUTTON" && !e.target.closest("#v-practice")) return;
  e.preventDefault();
  if (cur.phase === "split") checkSplit();
  else if (cur.phase === "done") $("btn-next").click();
});

/* ---------- results ---------- */
function endSession(early) {
  session.finished = true; session.early = !!early;
  if (early) session.items = session.items.slice(0, session.results.length);
  if (session.results.length && !session.test) {
    history.unshift({ ts: Date.now(), ...session.kind, score: points(), max: maxPoints() });
    history = history.slice(0, 8); store.set("history", history);
  }
  $("p-bar").style.width = "100%";
  renderResults();
  show("results");
  // confetti only for a full round of new words, not for practising mistakes again
  if (points() === maxPoints() && maxPoints() > 0 && !early && session.kind.kind === "level") confetti();
}
// the big reward for a round with every word right; with Reduce Motion the pieces only fade in and out where they are
function confetti() {
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const cv = document.createElement("canvas"), ctx = cv.getContext("2d"), dpr = devicePixelRatio || 1;
  cv.className = "confetti"; document.body.appendChild(cv);
  const W = innerWidth, H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  const colors = ["F", "R", "A", "B", "L"].map(k => css.getPropertyValue("--t-" + k).trim()).concat(css.getPropertyValue("--ok").trim(), "#f5b700");
  const rnd = (a, b) => a + Math.random() * (b - a);
  const bits = Array.from({ length: still ? 90 : 170 }, (_, i) => {
    const left = i % 2 === 0;
    return still
      ? { x: rnd(0, W), y: rnd(0, H), vx: 0, vy: 0, r: rnd(0, 6.3), vr: 0, w: rnd(6, 11), h: rnd(4, 7), c: colors[i % colors.length], t0: rnd(0, 500) }
      : { x: left ? -10 : W + 10, y: H * rnd(.75, 1), vx: (left ? 1 : -1) * rnd(4, 13) * Math.min(1, W / 700 + .4), vy: -rnd(11, 21) * Math.min(1, H / 900 + .3),
          r: rnd(0, 6.3), vr: rnd(-.3, .3), w: rnd(6, 11), h: rnd(4, 7), c: colors[i % colors.length], t0: rnd(0, 250), wob: rnd(0, 6.3) };
  });
  const dur = still ? 2600 : 3400, start = performance.now();
  (function frame(now) {
    const t = now - start;
    if (t > dur || view !== "results") { cv.remove(); return; }
    ctx.clearRect(0, 0, W, H);
    bits.forEach(b => {
      if (t < b.t0) return;
      if (!still) { b.vy += .38; b.vx *= .985; b.vy *= .985; b.x += b.vx + Math.sin((t + b.wob * 300) / 180) * .8; b.y += b.vy; b.r += b.vr; }
      const life = still ? Math.min(1, (t - b.t0) / 300) * Math.min(1, (dur - t) / 900) : Math.min(1, (dur - t) / 600);
      ctx.globalAlpha = Math.max(0, life);
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.scale(1, still ? 1 : Math.cos(t / 120 + b.wob));
      ctx.fillStyle = b.c; ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); ctx.restore();
    });
    requestAnimationFrame(frame);
  })(start);
}
function renderResults() {
  const max = maxPoints(), pts = points();
  $("r-score").textContent = `${pts}/${max}`;
  const pct = max ? pts / max : 0;
  const perfect = max > 0 && pts === max && !session.early;
  $("r-score").classList.toggle("perfect", perfect);
  $("r-title").textContent = perfect ? t("r100") : pct >= .9 ? t("r90") : pct >= .7 ? t("r70") : pct >= .5 ? t("r50") : t("r0");
  const wrong = session.results.filter(r => !r.reported && !r.splitOk);
  $("r-sub").textContent = t("resSub", session.results.length, wrong.length, roundLabel(session.kind));
  $("r-rows").innerHTML = session.results.map(r =>
    `<tr><td class="mono"><b>${esc(r.item.word)}</b></td><td class="mono">${esc(r.userSegs.join(" | "))}</td><td class="mono">${esc(r.alt.segs.join(" | "))}</td>` +
    `<td>${r.reported ? `<span class="muted">${t("tagReported")}</span>` : r.splitOk ? '<span class="mark-ok">✓</span>' : `<span class="mark-bad">✗ ${t("tagSplit")}</span>`}</td></tr>`).join("");
  $("btn-retry-wrong").disabled = !wrong.length;
  $("btn-retry-wrong").onclick = () => startSession(shuffle(wrong.map(r => r.item)));
}
$("btn-menu").addEventListener("click", () => { renderStart(); show("start"); });
// only with ?test in the address: jump straight to the result of a perfect round
if (new URLSearchParams(location.search).has("test")) {
  $("btn-test-perfect").hidden = false;
  $("btn-test-perfect").addEventListener("click", () => {
    startSession(shuffle(mixedPool()).slice(0, 7));
    session.test = true;
    session.results = session.items.map(item => ({ item, userSegs: item.alts[0].segs, alt: item.alts[0], splitOk: true, hint: false }));
    endSession(false);
  });
}
$("btn-again").addEventListener("click", () => startSession());

/* ---------- init ---------- */
applyStatic();
renderStart();
</script>

<script>
/* offline: cache the app after the first visit (only when served from a web address) */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
